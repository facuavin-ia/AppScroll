<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AppScroll</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <nav class="feeds">
    <button data-feed="rubro" class="active">Mi rubro</button>
    <button data-feed="amigos">Amigos</button>
  </nav>
  <div class="chips" id="chips"></div>
</header>

<main id="feed" class="feed"></main>

<footer class="bottom">
  <button data-view="feed" class="active">▶︎<span>Feed</span></button>
  <button data-view="ideas">💡<span>Ideas</span></button>
  <button id="addBtn" class="add">＋</button>
  <button data-view="claude">🧠<span>Claude</span></button>
  <button data-view="ajustes">⚙︎<span>Ajustes</span></button>
</footer>

<section id="panel" class="panel hidden"></section>

<dialog id="addDialog">
  <form method="dialog" id="addForm">
    <h2>Agregar video</h2>
    <label>Link (YouTube Shorts, TikTok, Instagram, .mp4)
      <input name="url" type="url" required placeholder="https://...">
    </label>
    <label>Título <input name="title" placeholder="De qué trata"></label>
    <label>Categoría
      <select name="cat"></select>
    </label>
    <label>Repo de GitHub relacionado (opcional)
      <input name="repo" placeholder="owner/repo o URL">
    </label>
    <label>Notas <textarea name="notes" rows="2"></textarea></label>
    <menu><button value="cancel" formnovalidate>Cancelar</button><button value="ok" class="primary">Guardar</button></menu>
  </form>
</dialog>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
